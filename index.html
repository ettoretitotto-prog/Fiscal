<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Scontrino Digitale</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="/firebase-config.js?v=1"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 16px; }
        .card { background: #1a1a2e; border-radius: 20px; padding: 28px 24px 24px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,0,0.08); }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,215,0,0.15); border-top-color: #f5b342; border-radius: 50%; animation: spin 0.9s cubic-bezier(0.4,0,0.2,1) infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; text-align: center; }
        #loading .text { color: rgba(255,255,255,0.5); font-size: 0.95rem; max-width: 220px; line-height: 1.5; }
        #loading .sub { color: rgba(255,255,255,0.2); font-size: 0.7rem; margin-top: 8px; }
        #receipt { display: none; }
        #receipt.show { display: block; animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .receipt-header { text-align: center; border-bottom: 1px dashed rgba(255,255,255,0.08); padding-bottom: 16px; margin-bottom: 16px; }
        .receipt-header h1 { font-size: 1.25rem; font-weight: 700; color: #f5b342; margin: 0 0 4px; }
        .receipt-header .sub { font-size: 0.75rem; color: rgba(255,255,255,0.4); letter-spacing: 0.04em; }
        .receipt-header .datetime { font-size: 0.7rem; color: rgba(255,255,255,0.3); margin-top: 6px; }
        .receipt-items { margin-bottom: 16px; }
        .receipt-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; color: rgba(255,255,255,0.8); border-bottom: 1px solid rgba(255,255,255,0.04); }
        .receipt-item:last-child { border-bottom: none; }
        .item-left { display: flex; gap: 6px; flex: 1; }
        .item-qty { color: rgba(255,255,255,0.35); min-width: 28px; }
        .item-name { flex: 1; }
        .item-price { font-weight: 500; color: rgba(255,255,255,0.9); white-space: nowrap; }
        .receipt-totals { border-top: 1px dashed rgba(255,255,255,0.08); padding-top: 12px; margin-bottom: 12px; }
        .total-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 3px 0; color: rgba(255,255,255,0.6); }
        .total-row.grand-total { font-size: 1.2rem; font-weight: 700; color: #f5b342; padding-top: 8px; border-top: 1px solid rgba(255,215,0,0.15); margin-top: 6px; }
        .vat-section { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
        .vat-section .vat-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
        .vat-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255,255,255,0.5); padding: 2px 0; }
        .receipt-footer { text-align: center; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,0.08); }
        .barcode { display: flex; justify-content: center; gap: 3px; margin-bottom: 10px; padding: 0 20px; }
        .barcode .bar { background: rgba(255,255,255,0.5); width: 2px; height: 32px; border-radius: 1px; }
        .barcode .bar.wide { width: 4px; }
        .barcode .bar.med { width: 3px; }
        .barcode .bar.gap { background: transparent; width: 4px; }
        .receipt-footer .tax-id { font-size: 0.65rem; color: rgba(255,255,255,0.25); letter-spacing: 0.04em; margin-bottom: 4px; }
        .receipt-footer .thanks { font-size: 0.8rem; color: rgba(255,215,0,0.6); font-weight: 500; }
        #error { display: none; text-align: center; padding: 40px 20px; }
        #error .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
         #error .text { color: rgba(255,100,100,0.7); font-size: 0.9rem; }
         
         /* Contact Form Styles */
         #contact-form { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.08); }
         #contact-form.show { display: block; animation: fadeIn 0.6s ease forwards; }
         .contact-form-title { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 12px; text-align: center; }
         .contact-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
         .contact-tab { flex: 1; padding: 8px 12px; border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; background: rgba(255,215,0,0.05); color: rgba(255,255,255,0.5); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.3s ease; text-align: center; }
         .contact-tab.active { background: rgba(255,215,0,0.15); color: #f5b342; border-color: rgba(255,215,0,0.4); }
         .contact-tab:hover { border-color: rgba(255,215,0,0.3); }
         .contact-input-group { margin-bottom: 12px; }
         .contact-input { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: rgba(255,255,255,0.9); font-size: 0.9rem; font-family: inherit; transition: all 0.3s ease; }
         .contact-input:focus { outline: none; background: rgba(255,255,255,0.08); border-color: rgba(255,215,0,0.3); box-shadow: 0 0 0 2px rgba(255,215,0,0.1); }
         .contact-input::placeholder { color: rgba(255,255,255,0.3); }
         .contact-submit { width: 100%; padding: 10px 12px; background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: #f5b342; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
         .contact-submit:hover { background: rgba(255,215,0,0.25); border-color: rgba(255,215,0,0.5); }
         .contact-submit:disabled { opacity: 0.5; cursor: not-allowed; }
         .contact-feedback { text-align: center; font-size: 0.85rem; color: rgba(100,200,100,0.8); margin-top: 10px; display: none; }
         .contact-feedback.show { display: block; animation: fadeIn 0.4s ease forwards; }
         .contact-error { color: rgba(255,100,100,0.8); }
     </style>
</head>
<body>
    <div class="card">
        <div id="loading">
            <div class="spinner"></div>
            <div class="text">In attesa del tuo scontrino digitale...</div>
            <div class="sub" id="cassa-label"></div>
        </div>
        <div id="receipt">
            <div class="receipt-header">
                <h1 id="store-name">📍 Punto Vendita</h1>
                <div class="sub">DOCUMENTO COMMERCIALE</div>
                <div class="datetime" id="receipt-datetime"></div>
            </div>
            <div class="receipt-items" id="items-container"></div>
            <div class="receipt-totals" id="totals-container"></div>
            <div class="vat-section">
                <div class="vat-title">🔹 Riepilogo IVA</div>
                <div id="vat-rows"></div>
            </div>
            <div class="receipt-footer">
                <div class="barcode" id="barcode-container"></div>
                <div class="tax-id" id="tax-id-display"></div>
                <div class="thanks">✨ Grazie per l'acquisto! ✨</div>
            </div>
            <!-- NUOVO: Form opzionale per raccolta contatti -->
            <div id="contact-form">
                <div class="contact-form-title">📱 Rimani in contatto</div>
                <div class="contact-tabs">
                    <button class="contact-tab active" data-type="instagram">Instagram</button>
                    <button class="contact-tab" data-type="telefono">Telefono</button>
                </div>
                <div class="contact-input-group">
                    <input type="text" id="contact-input" class="contact-input" placeholder="@tuohandle" />
                </div>
                <button class="contact-submit" id="contact-submit">Seguimi per offerte</button>
                <div class="contact-feedback" id="contact-feedback">✓ Grazie! Ti contatteremo presto</div>
            </div>
        </div>
        <div id="error">
            <div class="icon">⚠️</div>
            <div class="text" id="error-text">Link non valido</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const cassaId = new URLSearchParams(window.location.search).get('cassa') || 'demo01';
            document.getElementById('cassa-label').textContent = 'cassa ' + cassaId;


            firebase.initializeApp(FIREBASE_CONFIG);
            const db = firebase.database();

            // Listener realtime su nodo scontrini
            let receiptFound = false;
            const ref = db.ref('scontrini');
            
            ref.orderByChild('cassa_id').equalTo(cassaId).on('child_added', function(childSnapshot) {
                if (receiptFound) return;
                
                const d = childSnapshot.val();
                
                if (d.status !== 'UNCLAIMED') return;

                // Verifica TTL 45s - calcola dinamicamente
                let ts = d.timestamp;
                const now = Date.now();
                if (ts && (now - ts) > 45000) return;

                // Match! Marca CLAIMED e renderizza
                receiptFound = true;
                childSnapshot.ref.update({ status: 'CLAIMED' }).then(function() {
                    ref.off(); // scollega listener
                    render(d.data);
                }).catch(function(error) {
                    console.error('Error updating status:', error);
                    receiptFound = false;
                });
            }, function(error) {
                console.error('Database error:', error);
                showError('Errore di connessione al database');
            });

            function render(data) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('receipt').classList.add('show');
                document.getElementById('store-name').textContent = '📍 ' + (data.store_name || 'Cassa ' + (data.cassa_id || cassaId));
                const dt = new Date();
                document.getElementById('receipt-datetime').textContent = dt.toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',year:'numeric'}) + '  •  ' + dt.toLocaleTimeString('it-IT', {hour:'2-digit',minute:'2-digit'});
                const items = data.items || [];
                let subtotal = 0;
                const container = document.getElementById('items-container');
                container.innerHTML = '';
                items.forEach(function(item) {
                    const qty = item.qty || 1, price = item.price || 0, line = qty * price;
                    subtotal += line;
                    const div = document.createElement('div');
                    div.className = 'receipt-item';
                    div.innerHTML = '<div class="item-left"><span class="item-qty">' + qty + 'x</span><span class="item-name">' + esc(item.name || 'Prodotto') + '</span></div><span class="item-price">€ ' + line.toFixed(2) + '</span>';
                    container.appendChild(div);
                });
                const total = data.total !== undefined ? data.total : subtotal;
                const vat = total - (total / 1.22), taxable = total - vat;
                document.getElementById('totals-container').innerHTML = '<div class="total-row"><span>Imponibile</span><span>€ ' + taxable.toFixed(2) + '</span></div><div class="total-row"><span>IVA 22%</span><span>€ ' + vat.toFixed(2) + '</span></div><div class="total-row grand-total"><span>Totale</span><span>€ ' + total.toFixed(2) + '</span></div>';
                document.getElementById('vat-rows').innerHTML = '<div class="vat-row"><span>22% su € ' + taxable.toFixed(2) + '</span><span>€ ' + vat.toFixed(2) + '</span></div>';
                document.getElementById('tax-id-display').textContent = 'Cod. Fiscale / P.IVA: ' + (data.tax_id || 'IT00000000000');
                const bc = document.getElementById('barcode-container');
                bc.innerHTML = '';
                'wide,gap,med,gap,bar,gap,wide,gap,bar,gap,med,gap,bar,gap,wide,gap,med,gap,bar,gap,wide,gap,bar,gap,med,gap,wide,gap,bar,gap,med,gap,bar,gap,wide,gap,bar,gap,med,gap,wide,gap,bar,gap,med,gap,bar,gap,wide,gap,med,gap,bar,gap,wide,gap,bar,gap,med,gap,bar,gap,wide,gap'.split(',').forEach(function(cls) { var b = document.createElement('div'); b.className = 'bar ' + cls; bc.appendChild(b); });
                
                // NUOVO: Mostra il form di raccolta contatti
                initContactForm();
            }
            
            // NUOVO: Gestione form contatti
            let currentContactType = 'instagram';
            
            function initContactForm() {
                const contactForm = document.getElementById('contact-form');
                const tabs = document.querySelectorAll('.contact-tab');
                const input = document.getElementById('contact-input');
                const submitBtn = document.getElementById('contact-submit');
                const feedback = document.getElementById('contact-feedback');
                
                // Tab switching
                tabs.forEach(function(tab) {
                    tab.addEventListener('click', function() {
                        tabs.forEach(function(t) { t.classList.remove('active'); });
                        this.classList.add('active');
                        currentContactType = this.dataset.type;
                        
                        // Aggiorna placeholder e label bottone
                        if (currentContactType === 'instagram') {
                            input.placeholder = '@tuohandle';
                            submitBtn.textContent = 'Seguimi per offerte';
                        } else {
                            input.placeholder = '+39 123 456 7890';
                            submitBtn.textContent = 'Contattami';
                        }
                        input.value = '';
                        feedback.classList.remove('show');
                    });
                });
                
                // Submit handler
                submitBtn.addEventListener('click', function() {
                    const value = input.value.trim();
                    if (!value) {
                        feedback.textContent = '⚠ Inserisci un valore valido';
                        feedback.classList.add('show', 'contact-error');
                        setTimeout(function() { feedback.classList.remove('show'); }, 3000);
                        return;
                    }
                    
                    submitBtn.disabled = true;
                    
                    // Normalizza il valore
                    let normalizedValue, path;
                    if (currentContactType === 'instagram') {
                        normalizedValue = value.toLowerCase().replace(/^@/, '').trim();
                        path = 'clienti/' + cassaId + '/instagram/' + normalizedValue;
                    } else {
                        normalizedValue = value.replace(/\D/g, ''); // solo cifre
                        if (normalizedValue.length < 10) {
                            feedback.textContent = '⚠ Numero di telefono non valido';
                            feedback.classList.add('show', 'contact-error');
                            submitBtn.disabled = false;
                            setTimeout(function() { feedback.classList.remove('show'); }, 3000);
                            return;
                        }
                        path = 'clienti/' + cassaId + '/telefono/' + normalizedValue;
                    }
                    
                    // Scrivi/aggiorna su Firebase con merge
                    const updates = {};
                    updates[path] = {
                        [currentContactType === 'instagram' ? 'instagram_handle' : 'telefono']: normalizedValue,
                        'primo_contatto': firebase.database.ServerValue.TIMESTAMP,
                        'ultimo_contatto': firebase.database.ServerValue.TIMESTAMP,
                        'numero_scontrini': firebase.database.ServerValue.increment(1),
                        'opt_in_marketing': true
                    };
                    
                    db.ref().update(updates).then(function() {
                        feedback.textContent = '✓ Grazie! Ti contatteremo presto';
                        feedback.classList.remove('contact-error');
                        feedback.classList.add('show');
                        input.value = '';
                        submitBtn.disabled = false;
                        setTimeout(function() { feedback.classList.remove('show'); }, 4000);
                    }).catch(function(error) {
                        console.error('Error saving contact:', error);
                        feedback.textContent = '⚠ Errore nel salvataggio. Riprova.';
                        feedback.classList.add('show', 'contact-error');
                        submitBtn.disabled = false;
                        setTimeout(function() { feedback.classList.remove('show'); }, 3000);
                    });
                });
                
                contactForm.classList.add('show');
            }
            
            function showError(msg) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('receipt').classList.remove('show');
                const err = document.getElementById('error');
                err.style.display = 'block';
                err.querySelector('.text').textContent = msg;
            }
            function esc(str) { var d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
        })();
    </script>
</body>
</html>
